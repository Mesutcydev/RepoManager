name: RepoManager
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  TestFlight: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '24'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    SUPPORTS_MACCATALYST: YES
    'ARCHS[sdk=macosx*]': arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_ENHANCED_SECURITY: YES
    ENABLE_POINTER_AUTHENTICATION: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES_AGGRESSIVE
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PUH4GMFV56
packages:
  RepoManagerCore:
    path: Packages/RepoManagerCore
  RepoManagerUI:
    path: Packages/RepoManagerUI
targets:
  RepoManager:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RepoManagerCore
      - package: RepoManagerUI
      - target: RepoManagerShare
      - target: VerifyDependencies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.repomanager
        PRODUCT_NAME: RepoManager
        # Public identity of the dedicated GitHub App owned by Mesutcydev.
        REPO_MANAGER_GITHUB_CLIENT_ID: 'Iv23liukghEjpO3HgPsd'
        REPO_MANAGER_GITHUB_APP_SLUG: 'repo-manager-by-mesutcydev'
        # MIT source is public. ChatGPT authentication never passes through the Pro gate.
        REPO_MANAGER_OPEN_SOURCE_URL: 'https://github.com/Mesutcydev/RepoManager'
        # Pro unlocks only API-key providers and custom HTTPS endpoints.
        REPO_MANAGER_PRO_API_PROVIDERS_ENABLED: YES
        REPO_MANAGER_CHATGPT_MONETIZATION_CLEARED: NO
        REPO_MANAGER_PRO_PRODUCT_ID: 'com.mesutcydev.repomanager.pro.apiProviders'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/RepoManager.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': App/RepoManagerCatalyst.entitlements
        'ENABLE_HARDENED_RUNTIME[sdk=macosx*]': YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
        'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]': '$(inherited) RM_APPLE_PCC'
        'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]': '$(inherited) RM_APPLE_PCC'
        'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx27*]': '$(inherited) RM_APPLE_PCC'
      configs:
        Debug:
          REPO_MANAGER_CHATGPT_PLAN_USAGE_ENABLED: YES
        Release:
          REPO_MANAGER_CHATGPT_PLAN_USAGE_ENABLED: YES
        TestFlight:
          REPO_MANAGER_CHATGPT_PLAN_USAGE_ENABLED: YES
    preBuildScripts:
      - name: Validate GitHub sign-in configuration
        script: '"${SRCROOT}/scripts/validate_github_configuration.sh"'
        inputFiles: ['$(SRCROOT)/scripts/validate_github_configuration.sh']
        basedOnDependencyAnalysis: false
      - name: Validate ChatGPT release configuration
        script: '"${SRCROOT}/scripts/validate_chatgpt_configuration.sh"'
        inputFiles: ['$(SRCROOT)/scripts/validate_chatgpt_configuration.sh', '$(SRCROOT)/LICENSE']
        basedOnDependencyAnalysis: false
  RepoManagerShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: RepoManagerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.repomanager.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/RepoManagerShare.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': ShareExtension/RepoManagerShareCatalyst.entitlements
        'ENABLE_HARDENED_RUNTIME[sdk=macosx*]': YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  RepoManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: RepoManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.repomanager.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RepoManager
  RepoManagerSecurityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/NativeSecurity]
    dependencies:
      - target: RepoManager
      - package: RepoManagerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesutcydev.repomanager.securitytests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/RepoManager.app/RepoManager'
        'TEST_HOST[sdk=macosx*]': '$(BUILT_PRODUCTS_DIR)/RepoManager.app/Contents/MacOS/RepoManager'
        BUNDLE_LOADER: '$(TEST_HOST)'
aggregateTargets:
  VerifyDependencies:
    buildScripts:
      - name: Verify swift-sodium provenance
        script: '"${SRCROOT}/scripts/verify_dependency_provenance.sh"'
        basedOnDependencyAnalysis: false
    settings:
      # Hashing the package checkout reads outside SRCROOT; only this one script runs unsandboxed.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  RepoManager:
    build:
      targets:
        RepoManager: all
        RepoManagerShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RepoManagerUITests
        - name: RepoManagerSecurityTests
          skippedTests: [ProStoreKitTests]
  RepoManagerTestFlight:
    build:
      targets:
        RepoManager: all
        RepoManagerShare: all
    archive:
      config: TestFlight
  RepoManagerStoreKitTests:
    build:
      targets:
        RepoManager: all
        RepoManagerShare: all
    run:
      config: Debug
      storeKitConfiguration: Tests/NativeSecurity/RepoManagerPro.storekit
    test:
      config: Debug
      language: en
      region: US
      targets:
        - name: RepoManagerSecurityTests
          selectedTests: [ProStoreKitTests]
  ProPaywallPreview:
    build:
      targets:
        RepoManager: all
        RepoManagerShare: all
    test:
      config: Debug
      language: en
      region: US
      commandLineArguments:
        --ui-fixtures: true
        --pro-fixtures: true
        --reduced-motion-fixtures: true
      targets:
        - name: RepoManagerSecurityTests
          selectedTests: [ProPaywallSnapshotTests]
